<script>
async function runVirtualPresenceScan(event) {
    event.preventDefault(); // Stop page reload

    // 1. Get DOM Elements
    const urlInput = document.getElementById('vpWebsiteUrl').value;
    const emailInput = document.getElementById('vpEmail').value;
    const formContainer = document.getElementById('virtual-presence-form');
    const loadingState = document.getElementById('vp-loading');
    const resultsState = document.getElementById('vp-results');
    const scoreValue = document.getElementById('vpScoreValue');
    const scoreCircle = document.getElementById('vpScoreCircle');
    const scoreInterpretation = document.getElementById('vpScoreInterpretation');

    // 2. Show Loading State
    formContainer.classList.add('hidden');
    loadingState.classList.remove('hidden');

    try {
        // 3. Hit your Cloudflare Worker
        const response = await fetch("https://submitcalculator.julioernestolv.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                url: urlInput,
                email: emailInput
            })
        });

        const data = await response.json();

        if (data.score !== undefined) {
            // 4. Update UI with Lean Data
            const finalScore = (data.score * 10).toFixed(1); // Converts 0.8 to 8.0
            scoreValue.innerText = finalScore;

            // Handle Frontend Colors dynamically
            let colorClass = "bg-red-500";
            let text = "Necesita Mejoras Críticas";

            if (data.score >= 0.8) {
                colorClass = "bg-green-500";
                text = "Excelente Presencia Virtual";
            } else if (data.score >= 0.5) {
                colorClass = "bg-yellow-500";
                text = "Presencia Moderada - Hay Fugas";
            }

            scoreCircle.className = `inline-flex items-center justify-center size-32 rounded-full text-white text-5xl font-bold shadow-2xl ${colorClass}`;
            scoreInterpretation.innerText = text;

            // 5. Show Results
            loadingState.classList.add('hidden');
            resultsState.classList.remove('hidden');
        }
    } catch (error) {
        console.error("Scan Error:", error);
        alert("Hubo un error al escanear. Por favor, intenta de nuevo.");
        loadingState.classList.add('hidden');
        formContainer.classList.remove('hidden');
    }
}

// Attach the listener to your form
document.getElementById('virtualPresenceForm').addEventListener('submit', runVirtualPresenceScan);
</script>
