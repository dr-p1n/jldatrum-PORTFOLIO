name = "ai-visibility"
main = "ai-visibility-scanner.js"
compatibility_date = "2026-08-01"

# Rate limiting: 10 scans per IP per hour. Without this binding the endpoint
# would scan anything, for anyone, as fast as it is asked.
[[kv_namespaces]]
binding = "RATE"
id = "1361a8801c4f4c8ca804168b8c93a3d6"

# Report requests: one record per address, keyed by the address so a repeat
# request updates instead of duplicating. Create it once with
#   wrangler kv namespace create LEADS
# and paste the id below. Without the binding /lead answers 503 and the page
# says the report service is not configured — it never silently drops a lead.
[[kv_namespaces]]
binding = "LEADS"
id = "3d94515c1b3d4e70b7d983457fd33a47"

[observability]
enabled = true
